# Example provcat configuration.
# Copy it to ./provcat.yaml, or point PROVCAT_CONFIG at it.
#
# The org is the tenant, and it is the first part of every logical URI, as
# the owner is on GitHub. For lakeFS, which has no orgs, each tenant gets its
# own repositories, and each environment is a branch:
#
#   data+table://ORG/DOMAIN/ENV/...        -> lakefs-ORG://ORG-data-DOMAIN/ENV/tables/...
#   model://ORG/TEAM/ENV/PROJECT/...       -> lakefs-ORG://ORG-ml-PROJECT/ENV/TEAM/models/...
#   code://ORG/REPO/ENV/PATH               -> github://ORG/REPO/PATH, branch ENV
#
# lakeFS repository names have 3 to 63 lowercase letters, digits and "-",
# and branch names have letters, digits, "_" and "-". The match patterns
# keep both valid. An org has no "-", so the first "-" of a
# repository name always ends the org, and "data" or "ml" after it keeps
# tables and ML projects apart. Two names can therefore never give one
# repository. Each repository needs a branch for each environment, for
# example prod and dev.

stores:
  # file, s3, github, gs and az exist without configuration. Add named stores here.
  lakefs:
    driver: lakefs           # S3 gateway for data, REST API for pins and ?at=ts:
    endpoint_url: ${oc.env:LAKEFS_S3_ENDPOINT,http://localhost:8000}
    profile: lakefs          # keys in ~/.aws/credentials under [lakefs]

  # One store for each org, with that org's own keys. The logical schemes
  # below name the store lakefs-{org}, so a logical URI of an org resolves only
  # to that org's store. The admin store "lakefs" above reads every repository;
  # leave it out of a tenant's configuration. See "Tenants" in docs/design.md.
  lakefs-acme:
    driver: lakefs
    endpoint_url: ${oc.env:LAKEFS_S3_ENDPOINT,http://localhost:8000}
    profile: lakefs-acme
  lakefs-globex:
    driver: lakefs
    endpoint_url: ${oc.env:LAKEFS_S3_ENDPOINT,http://localhost:8000}
    profile: lakefs-globex

cache:
  root: ${oc.env:PROVCAT_CACHE,${oc.env:HOME}/.cache/provcat}

schemes:
  # data+table://org/domain/env/family/name[?at=branch:X|commit:X|stage:NAME|ts:TIME]
  data+table:
    parts: [org, domain, env, family, name]
    target: "lakefs-{org}://{org}-data-{domain}/{ref}/tables/{family}/{name}"
    ref: "{env}"
    match:
      org: "[a-z0-9]{1,20}"
      env: "[a-z0-9][a-z0-9_-]{0,19}"
      domain: "[a-z0-9][a-z0-9-]{0,36}"    # {org}-data-{domain} stays within 63

  # experiment://org/team/env/project/pipeline
  experiment:
    parts: [org, team, env, project, pipeline]
    target: "lakefs-{org}://{org}-ml-{project}/{ref}/{team}/experiments/{pipeline}"
    ref: "{env}"
    match: &ml_names
      org: "[a-z0-9]{1,20}"
      env: "[a-z0-9][a-z0-9_-]{0,19}"
      project: "[a-z0-9][a-z0-9-]{0,38}"   # {org}-ml-{project} stays within 63

  # model://org/team/env/project/model_name?at=version:N
  model:
    parts: [org, team, env, project, model_name]
    target: "lakefs-{org}://{org}-ml-{project}/{ref}/{team}/models/{model_name}/v{version}"
    ref: "{env}"
    match: *ml_names

  # artifact+prompt://org/team/env/project/name
  artifact+prompt:
    parts: [org, team, env, project, name]
    target: "lakefs-{org}://{org}-ml-{project}/{ref}/{team}/prompts/{name}"
    ref: "{env}"
    match: *ml_names
  artifact+card:
    parts: [org, team, env, project, name]
    target: "lakefs-{org}://{org}-ml-{project}/{ref}/{team}/cards/{name}"
    ref: "{env}"
    match: *ml_names

  # code://org/repo/env/path[?at=branch:X|tag:X|commit:X]
  # The env is the GitHub branch, as it is the lakeFS branch for data.
  code:
    parts: [org, repo, env]
    rest: path
    target: "github://{org}/{repo}/{path}"
    ref: "{env}"
    pass_selector: true
    # GitHub names: an owner has 1 to 39 letters, digits and single inner "-".
    # The env is a git branch name without "/". Name a branch with "/" by a
    # selector: code://org/repo/main/path?at=branch:feature/x
    match:
      org: '(?=.{1,39}\Z)[A-Za-z0-9](?:-?[A-Za-z0-9])*'
      repo: '[A-Za-z0-9._-]{1,100}'
      env: '(?!.*\.\.)(?!.*\.lock\Z)(?!.*\.\Z)(?!@\Z)[A-Za-z0-9_@+][A-Za-z0-9._+@-]{0,99}'

stages:
  "data+table://acme/shared/prod/agreements/qa_outputs":
    production: "commit:b8a2f9c123456"
