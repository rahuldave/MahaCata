# Example provcat configuration.
# Copy it to ./provcat.yaml, or point PROVCAT_CONFIG at it.
#
# The org is the tenant, and it is the first part of every logical URI, as
# the owner is on GitHub. For lakeFS, which has no orgs, each tenant gets its
# own repositories, and each environment is a branch:
#
#   data+table://ORG/DOMAIN/ENV/...        -> lakefs://ORG-data-DOMAIN/ENV/tables/...
#   model://ORG/TEAM/ENV/PROJECT/...       -> lakefs://ORG-ml-PROJECT/ENV/TEAM/models/...
#   code://ORG/REPO/PATH                   -> github://ORG/REPO/PATH
#
# lakeFS repository names have 3 to 63 lowercase letters, digits and "-",
# and branch names have letters, digits, "_" and "-". The match patterns
# keep both valid. An org has no "-", so the first "-" of a
# repository name always ends the org, and "data" or "ml" after it keeps
# tables and ML projects apart. Two names can therefore never give one
# repository. Each repository needs a branch for each environment, for
# example prod and dev.

stores:
  # file, s3 and github exist without configuration. Add named stores here.
  lakefs:
    driver: s3
    endpoint_url: ${oc.env:LAKEFS_S3_ENDPOINT,http://localhost:8000}
    profile: lakefs          # keys in ~/.aws/credentials under [lakefs]

cache:
  root: ${oc.env:PROVCAT_CACHE,${oc.env:HOME}/.cache/provcat}

schemes:
  # data+table://org/domain/env/family/name[?at=branch:X|commit:X|stage:NAME]
  data+table:
    parts: [org, domain, env, family, name]
    target: "lakefs://{org}-data-{domain}/{ref}/tables/{family}/{name}"
    ref: "{env}"
    match:
      org: "[a-z0-9]{1,20}"
      env: "[a-z0-9][a-z0-9_-]{0,19}"
      domain: "[a-z0-9][a-z0-9-]{0,36}"    # {org}-data-{domain} stays within 63

  # experiment://org/team/env/project/pipeline
  experiment:
    parts: [org, team, env, project, pipeline]
    target: "lakefs://{org}-ml-{project}/{ref}/{team}/experiments/{pipeline}"
    ref: "{env}"
    match: &ml_names
      org: "[a-z0-9]{1,20}"
      env: "[a-z0-9][a-z0-9_-]{0,19}"
      project: "[a-z0-9][a-z0-9-]{0,38}"   # {org}-ml-{project} stays within 63

  # model://org/team/env/project/model_name?at=version:N
  model:
    parts: [org, team, env, project, model_name]
    target: "lakefs://{org}-ml-{project}/{ref}/{team}/models/{model_name}/v{version}"
    ref: "{env}"
    match: *ml_names

  # artifact+prompt://org/team/env/project/name
  artifact+prompt:
    parts: [org, team, env, project, name]
    target: "lakefs://{org}-ml-{project}/{ref}/{team}/prompts/{name}"
    ref: "{env}"
    match: *ml_names
  artifact+card:
    parts: [org, team, env, project, name]
    target: "lakefs://{org}-ml-{project}/{ref}/{team}/cards/{name}"
    ref: "{env}"
    match: *ml_names

  # code://org/repo/path[?at=branch:X|tag:X|commit:X]
  code:
    parts: [org, repo]
    rest: path
    target: "github://{org}/{repo}/{path}"
    pass_selector: true

stages:
  "data+table://acme/shared/prod/agreements/qa_outputs":
    production: "commit:b8a2f9c123456"
