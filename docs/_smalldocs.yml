project:
  type: website
  output-dir: _site

website:
  title: MahaCata
  description: provcat, which resolves, reads and writes catalog URIs, provrun, which runs agents on them, and provevi, which stores and checks the evidence
  repo-url: https://github.com/rahuldave/MahaCata
  repo-subdir: docs
  page-navigation: true
  llms-txt: true
  navbar:
    left:
      - href: index.md
        text: Home
      - href: provcat-features.md
        text: provcat
      - href: provrun-features.md
        text: provrun
      - href: provevi-features.md
        text: provevi
      - href: api/index.md
        text: Reference
    tools:
      - icon: github
        href: https://github.com/rahuldave/MahaCata
  sidebar:
    style: floating
    contents:
      - index.md
      - section: provcat
        contents:
          - provcat-features.md
          - tour.md
          - reference.md
          - design.md
          - setup.md
          - transactions.md
          - lakefs-target.md
          - access-notes.md
      - section: provrun
        contents:
          - provrun-features.md
          - provrun-tour.md
          - provrun.md
          - provrun-plan.md
      - section: provevi
        contents:
          - provevi-features.md
          - provevi-tour.md
          - provevi.md
          - provevi-design.md
          - provevi-plan.md
          - trace-database.md
          - provevi-research/earlier-runtime-traces.md
          - provevi-research/mlflow-tracing.md
          - provevi-research/agent-hooks-claude-codex.md
          - provevi-research/agent-hooks-pydanticai-litellm.md
          - provevi-research/mlflow-autolog.md
          - provevi-research/library-telemetry.md
      - section: Reference
        contents: api/*

theme: folio
toc: true
code-copy: true
linkify: true
api:
  packages: [provcat, provrun, provevi]
  root: ..
  source: https://github.com/rahuldave/MahaCata/blob/main
