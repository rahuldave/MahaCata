[project]
name = "provcat"
version = "0.2.0"
description = "Resolve catalog URIs to files on local disk, S3-compatible storage and GitHub, with a local cache"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40.44",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
provc = "provcat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provcat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to a real service; set the environment variable named in the test to run it",
]

[dependency-groups]
dev = [
    "moto[server]>=5.2.4",
    "pytest>=9.1.1",
]
