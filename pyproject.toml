[project]
name = "mahacata"
version = "0.1.0"
description = "Workspace root for provcat and provrun"
requires-python = ">=3.13"
dependencies = [
    "provcat",
    "provrun[litellm,pydantic-ai]",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
provcat = { workspace = true }
provrun = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/provcat/tests", "packages/provrun/tests"]
addopts = "-m 'not system'"
markers = [
    "unit: no servers; only the code and temporary files",
    "integration: servers on this machine, such as moto and the cloud emulators",
    "system: real services on the network; set the environment variable named in the test",
]

[dependency-groups]
dev = [
    "azure-identity>=1.27.0",
    "azure-storage-blob>=12.31.0",
    "google-cloud-storage>=3.17.1",
    "moto[server]>=5.2.4",
    "pytest>=9.1.1",
]
system = [
    "azure-mgmt-resource>=26.0.0",
    "azure-mgmt-storage>=25.3.0",
]
