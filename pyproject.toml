[project]
name = "provcat"
version = "0.2.0"
description = "Resolve catalog URIs to files on local disk, S3-compatible storage and GitHub, with a local cache"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40.44",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
provc = "provcat.cli:main"

[project.optional-dependencies]
gcs = [
    "google-cloud-storage>=3.17.1",
]
azure = [
    "azure-identity>=1.27.0",
    "azure-storage-blob>=12.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provcat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not system'"
markers = [
    "unit: no servers; only the code and temporary files",
    "integration: servers on this machine, such as moto and the cloud emulators",
    "system: real services on the network; set the environment variable named in the test",
]

[dependency-groups]
dev = [
    "azure-identity>=1.27.0",
    "azure-storage-blob>=12.31.0",
    "google-cloud-storage>=3.17.1",
    "moto[server]>=5.2.4",
    "pytest>=9.1.1",
]
system = [
    "azure-mgmt-resource>=26.0.0",
    "azure-mgmt-storage>=25.3.0",
]
