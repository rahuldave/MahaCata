[project]
name = "provevi"
version = "0.1.0"
description = "Store, read and check the evidence of provrun's runs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "provcat",
]

[project.scripts]
prove = "provevi.cli:main"

[tool.uv.sources]
provcat = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provevi"]
