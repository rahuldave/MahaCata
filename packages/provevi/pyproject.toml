[project]
name = "provevi"
version = "0.1.0"
description = "Store, read and check the evidence of provrun's runs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "packaging>=24",
    "provcat",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# One minor release, as the design says: MLflow changes its tables often, and
# the copy is tested against each minor release before the pin moves.
mlflow = ["mlflow>=3.17.2,<3.18"]

[project.scripts]
prove = "provevi.cli:main"

[tool.uv.sources]
provcat = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provevi"]
