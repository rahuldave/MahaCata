[project]
name = "provcat"
version = "0.2.0"
description = "Resolve, read and write catalog URIs in local files, S3, GCS, Azure, lakeFS, GitHub and Hugging Face, with a local cache"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40.44",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
provc = "provcat.cli:main"

[project.entry-points."provcat.hooks"]
"provcat.log" = "provcat.hooks:log"
"provcat.logical_only" = "provcat.hooks:logical_only"

[project.optional-dependencies]
gcs = [
    "google-cloud-storage>=3.17.1",
]
azure = [
    "azure-identity>=1.27.0",
    "azure-storage-blob>=12.31.0",
]
hf = [
    "huggingface_hub>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provcat"]
