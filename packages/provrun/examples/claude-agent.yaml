# Run a real PydanticAI agent with tools, on a local file. Make the file first:
#   mkdir -p /tmp/provrun-example && echo "Revenue in 2025 was 42 million." > /tmp/provrun-example/report.txt
# Set ANTHROPIC_API_KEY before the run.
run:
  org: acme
  domain: demo
  env: dev
  actor: you@example.com
agent:
  name: revenue-agent
  backend: pydantic-ai
  model: anthropic:claude-haiku-5-5
  instructions: >-
    Answer from the inputs only. Use grep_file to find the facts. Record the
    line you used with add_note. Write the answer to /output/answer.txt.
  prompt: What was revenue in 2025?
  inputs:
    - file:///tmp/provrun-example/report.txt
  tools: [grep_file, add_note]
  settings:
    max_tokens: 1000
  limits:
    request_limit: 10
