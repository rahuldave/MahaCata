[project]
name = "provrun"
version = "0.1.0"
description = "Run agents and model calls on catalog data, and record the evidence of each run"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "provcat",
    "opentelemetry-api>=1.30.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# An exact version, so that no new release arrives unread. 1.82.7, 1.82.8
# and 1.107.0 were malicious. 1.83.0 is the first release from LiteLLM's
# rebuilt pipeline. Later releases cap openai (1.83.1 and later) or
# huggingface-hub (1.104.0 and later) below what pydantic-ai 2.32 and later
# and the hf driver need, so they cannot share this workspace.
litellm = ["litellm==1.83.0"]
pydantic-ai = [
    "pydantic-ai-slim>=2.64.0",
    "pydantic-ai-filesystem-sandbox>=0.9.0",
]

[project.scripts]
provr = "provrun.cli:main"

[project.entry-points."provrun.backends"]
litellm = "provrun.backends.litellm:LiteLLMBackend"
pydantic-ai = "provrun.backends.pydantic_ai:PydanticAIBackend"

[project.entry-points."provrun.stagers"]
in-process = "provrun.stagers:InProcessStager"

[project.entry-points."provrun.tools"]
grep_file = "provrun.tools.grep:grep_file"
add_note = "provrun.tools.note:add_note"

[tool.uv.sources]
provcat = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provrun"]
